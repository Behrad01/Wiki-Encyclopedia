{% extends "encyclopedia/layout.html" %}

{% block body %}
    <form action="{% url 'edit' title %}" method="POST">
        {% csrf_token %}

        <p>Title:</p>
        <p>{{ title }}</p>

        <p>Content:</p>
        <textarea name="content">{{ content }}</textarea>

        <input type="submit">
    </form>
{% endblock %}
